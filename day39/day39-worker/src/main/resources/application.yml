spring:
  main:
    web-application-type: none   # 纯 RPC 提供方，不起 Web 容器

dubbo:
  application:
    name: worker-service
  registry:
    address: nacos://127.0.0.1:8848   # 复用 day37-nacos 当注册中心（对照笔记 §1.3）
  protocol:
    name: dubbo        # Dubbo 私有协议：TCP 长连接 + Hessian2 序列化，比 HTTP 文本轻
    port: 20880
