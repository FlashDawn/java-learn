spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        # lb:// 协议 = 从 Nacos 发现实例 + LoadBalancer 选择（对照笔记 §1.1/§1.3）
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: task-route
          uri: lb://task-service
          predicates:
            - Path=/tasks/**
server:
  port: 18099
